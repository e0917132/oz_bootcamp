<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <style>
        body {
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Pomodoro -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body text-center">
                        <h4 class="mb-3">Pomodoro Timer</h4>

                        <div class="input-group mb-3">
                            <input autocomplete="off" id="time-input" type="number" class="form-control" placeholder="분 단위 입력" />
                            <button id="start-timer" class="btn-solid theme-primary">시작</button>
                            <button id="stop-timer" class="btn-solid theme-danger">중지</button>
                        </div>
                        <div id="timer-display" class="fs-3 text-muted">시간을 설정하세요</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="6_timer-app.js"></script>
</body>
</html>
