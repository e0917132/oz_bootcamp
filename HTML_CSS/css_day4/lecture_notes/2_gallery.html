<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            padding: 10%;
            display: grid;
            gap: 0.8rem;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: repeat(4, 200px);

            grid-template-areas: 
                "img1 img3 img3"
                "img1 img4 img6"
                "img2 img2 img6"
                "img5 img5 img5"
        }

        img {
            width: 100%;
            height: 100%;
            /* 원본 비율 유지할 수 있게 사진을 자름 */
            object-fit: cover;
            /* 이미지 각을 둥글게 만듬 */
            border-radius: 0.6rem;
        }

        /* 한 사진에 마우스를 갖다대면 나머지 사진은 회색으로 */
        .container:hover img:not(:hover) {
            filter:grayscale(1);
            opacity: 0.5;
        }

        .img1 {
            grid-area: img1;
        }

        .img2 {
            grid-area: img2;
        }

        .img3 {
            grid-area: img3;
        }

        .img4 {
            grid-area: img4;
        }

        .img5 {
            grid-area: img5;
        }

        .img6 {
            grid-area: img6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item img1"><img src="https://images.unsplash.com/photo-1791570701394-68b48f39b3a4?q=80&w=745&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
        <div class="item img2"><img src="https://plus.unsplash.com/premium_photo-1769021899239-e797f678a87b?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
        <div class="item img3"><img src="https://images.unsplash.com/photo-1790058210893-0378d6adf0c2?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
        <div class="item img4"><img src="https://images.unsplash.com/photo-1792163714276-04ac34422845?q=80&w=1690&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
        <div class="item img5"><img src="https://images.unsplash.com/photo-1792058867784-62591f193e02?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
        <div class="item img6"><img src="https://plus.unsplash.com/premium_photo-1791970067676-9092d628a575?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt=""></div>
    </div>
</body>
</html>
