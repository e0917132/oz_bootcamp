<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            background-color: orange;
            border: 1px solid black;
        }
        span {
            background-color: aqua;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <!-- Block-level 요소: 가로 한줄 전체 차지 -->
    <div>A</div>
    <div>B</div>
    <div>C</div>

    <!-- Inline 요소 -->
    Lorem ipsum dolor, sit amet <span>consectetur</span> adipisicing elit. Exercitationem, consequatur quae maxime minima molestiae illum dolore quis quidem labore sit officia reprehenderit <span>quisquam</span> praesentium <span>doloribus</span>. Voluptatibus iste esse et dicta!
    
    
</body>
</html>
